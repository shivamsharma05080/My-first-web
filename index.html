<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOUL SMP | Official Store</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at center, #2b0000 0%, #0a0000 100%);
      color: #ffffff;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }
    /* Top Navigation bar for Discord */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background: rgba(15, 0, 0, 0.8);
      border-bottom: 2px solid #ff1a1a;
    }
    .logo-text {
      font-size: 1.5rem;
      font-weight: bold;
      color: #ff3333;
      text-shadow: 0 0 10px #ff0000;
      letter-spacing: 2px;
    }
    .discord-icon-btn {
      background-color: #5865F2;
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: 0.3s;
      box-shadow: 0 0 15px rgba(88, 101, 242, 0.4);
    }
    .discord-icon-btn:hover {
      background-color: #4752C4;
      transform: scale(1.05);
    }

    /* Header Section */
    header {
      text-align: center;
      padding: 40px 20px;
    }
    header h1 {
      font-size: 3.5rem;
      color: #ff3333;
      text-shadow: 0 0 20px #ff0000;
      margin: 0;
    }
    header p {
      color: #bbbbbb;
      font-size: 1.2rem;
      margin-top: 10px;
    }

    /* Container & Sections */
    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }
    .section-title {
      color: #ff4d4d;
      border-left: 5px solid #ff0000;
      padding-left: 10px;
      margin: 40px 0 20px 0;
      font-size: 1.8rem;
    }

    /* Grid layout for Ranks */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
    }
    .rank-box {
      background: rgba(40, 0, 0, 0.6);
      border: 1px solid #660000;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .rank-box:hover {
      border-color: #ff3333;
      background: rgba(70, 0, 0, 0.8);
      transform: translateY(-5px);
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
    }
    .rank-box img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      margin-bottom: 10px;
      image-rendering: pixelated; /* Minecraft ke pixel look ke liye */
    }
    .rank-box h3 {
      margin: 10px 0 0 0;
      font-size: 1.1rem;
      color: #ffffff;
    }

    /* Premium Ranks specific grid */
    .premium-grid {
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }
    .premium-box {
      background: linear-gradient(135deg, rgba(80, 0, 0, 0.8), rgba(20, 0, 0, 0.9));
      border: 2px solid #ff0000;
    }

    /* Popup Modal Styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #1a0000;
      border: 2px solid #ff3333;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      max-width: 350px;
      width: 90%;
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.6);
    }
    .modal-content h2 { color: #ff3333; margin-top: 0; }
    .modal-content p { color: #ccc; }
    .buy-btn {
      display: inline-block;
      background: #ff0000;
      color: white;
      padding: 12px 25px;
      text-decoration: none;
      font-weight: bold;
      border-radius: 6px;
      margin-top: 15px;
      transition: 0.2s;
    }
    .buy-btn:hover { background: #cc0000; transform: scale(1.05); }
    .close-btn {
      display: block;
      margin-top: 15px;
      color: #aaa;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .close-btn:hover { color: white; }
  </style>
</head>
<body>

  <!-- Top Navigation with Discord Button -->
  <nav>
    <div class="logo-text">🔥 SOUL SMP</div>
    <a href="https://discord.gg/BHHU8mDvh7" target="_blank" class="discord-icon-btn">
      <i class="fa-brands fa-discord"></i> Discord
    </a>
  </nav>

  <!-- Header -->
  <header>
    <h1>SERVER STORE</h1>
    <p>Apni manpasand rank chunein aur server ko support karein!</p>
  </header>

  <div class="container">
    
    <!-- Player Ranks Section -->
    <h2 class="section-title">Player Ranks</h2>
    <div class="grid">
      <div class="rank-box" onclick="openModal('Member', 'Free Rank', 'Server join karte hi milti hai!')"><img src="https://minecraft.wiki/images/Leather_Tunic_JE2_BE2.png" alt="Member"><h3>Member</h3></div>
      <div class="rank-box" onclick="openModal('Rookie', 'In-game Money', 'Starting package aur basic permissions.')"><img src="https://minecraft.wiki/images/Wooden_Sword_JE2_BE2.png" alt="Rookie"><h3>Rookie</h3></div>
      <div class="rank-box" onclick="openModal('Knight', 'In-game Money', 'Iron kit aur /kit tools ka access.')"><img src="https://minecraft.wiki/images/Iron_Sword_JE2_BE2.png" alt="Knight"><h3>Knight</h3></div>
      <div class="rank-box" onclick="openModal('Warrior', 'In-game Money', 'Enchanted weapons aur /sethome 2.')"><img src="https://minecraft.wiki/images/Iron_Chestplate_JE2_BE2.png" alt="Warrior"><h3>Warrior</h3></div>
      <div class="rank-box" onclick="openModal('Elite', 'In-game Money', 'Diamond tools aur special chat tag.')"><img src="https://minecraft.wiki/images/Diamond_Sword_JE1_BE1.png" alt="Elite"><h3>Elite</h3></div>
      <div class="rank-box" onclick="openModal('Hero', 'In-game Money', 'Advanced commands aur kit access.')"><img src="https://minecraft.wiki/images/Diamond_Chestplate_JE1_BE1.png" alt="Hero"><h3>Hero</h3></div>
      <div class="rank-box" onclick="openModal('Titan', 'In-game Money', 'Netherite gear aur special perks.')"><img src="https://minecraft.wiki/images/Netherite_Sword_JE1_BE1.png" alt="Titan"><h3>Titan</h3></div>
      <div class="rank-box" onclick="openModal('Legend', 'In-game Money', 'Legendary kit aur extra homes.')"><img src="https://minecraft.wiki/images/Netherite_Chestplate_JE1.png" alt="Legend"><h3>Legend</h3></div>
      <div class="rank-box" onclick="openModal('Mythic', 'In-game Money', 'Mythic items aur special particle effects.')"><img src="https://minecraft.wiki/images/Nether_Star.png" alt="Mythic"><h3>Mythic</h3></div>
      <div class="rank-box" onclick="openModal('Immortal', 'In-game Money', 'Sabhi regular ranks ka peak version!')"><img src="https://minecraft.wiki/images/Dragon_Head.png" alt="Immortal"><h3>Immortal</h3></div>
    </div>

    <!-- Premium Ranks Section -->
    <h2 class="section-title">👑 Premium Ranks</h2>
    <div class="grid premium-grid">
      <div class="rank-box premium-box" onclick="openModal('VIP', '₹99 / month', 'Special prefix, /fly command, aur 3 set homes!')"><img src="https://minecraft.wiki/images/Gold_Ingot_JE3_BE3.png" alt="VIP"><h3>VIP</h3></div>
      <div class="rank-box premium-box" onclick="openModal('MVP', '₹199 / month', 'VIP sabhi features + /heal, /feed access!')"><img src="https://minecraft.wiki/images/Diamond_JE3_BE3.png" alt="MVP"><h3>MVP</h3></div>
      <div class="rank-box premium-box" onclick="openModal('MVP+', '₹299 / month', 'MVP features + Custom chat colors & kits!')"><img src="https://minecraft.wiki/images/Emerald_JE3_BE3.png" alt="MVP+"><h3>MVP+</h3></div>
      <div class="rank-box premium-box" onclick="openModal('Elite+', '₹399 / month', 'Exclusive elite perks aur server priority!')"><img src="https://minecraft.wiki/images/Enchanted_Golden_Apple_JE2_BE2.gif" alt="Elite+"><h3>Elite+</h3></div>
      <div class="rank-box premium-box" onclick="openModal('Legend+', '₹499 / month', 'Ultimate server power, custom commands & tags!')"><img src="https://minecraft.wiki/images/Netherite_Ingot_JE1_BE1.png" alt="Legend+"><h3>Legend+</h3></div>
    </div>

  </div>

  <!-- Popup Modal Box -->
  <div id="rankModal" class="modal">
    <div class="modal-content">
      <h2 id="modalTitle">Rank Name</h2>
      <p id="modalPrice" style="color: #ff3333; font-weight: bold; font-size: 1.2rem;"></p>
      <p id="modalDesc">Description here</p>
      <a href="https://discord.gg/BHHU8mDvh7" target="_blank" class="buy-btn">BUY NOW VIA DISCORD</a>
      <span class="close-btn" onclick="closeModal()">Close Window</span>
    </div>
  </div>

  <script>
    function openModal(name, price, desc) {
      document.getElementById('modalTitle').innerText = name;
      document.getElementById('modalPrice').innerText = price;
      document.getElementById('modalDesc').innerText = desc;
      document.getElementById('rankModal').style.display = 'flex';
    }
    function closeModal() {
      document.getElementById('rankModal').style.display = 'none';
    }
    window.onclick = function(event) {
      let modal = document.getElementById('rankModal');
      if (event.target == modal) {
        modal.style.display = 'none';
      }
    }
  </script>

</body>
</html>
