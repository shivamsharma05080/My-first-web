<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOUL SMP | Official Store</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1a0000, #000000);
      color: #ffffff;
      margin: 0;
      padding: 20px;
    }
    header {
      text-align: center;
      padding: 50px 20px;
      border-bottom: 3px solid #ff0000;
    }
    h1 { color: #ff3333; font-size: 3rem; text-shadow: 0 0 10px #ff0000; }
    
    .container { max-width: 900px; margin: auto; }
    
    .section-title { color: #ff5555; text-align: center; margin-top: 40px; font-size: 1.8rem; }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }
    
    .rank-card {
      background: rgba(255, 0, 0, 0.1);
      border: 1px solid #440000;
      padding: 15px;
      text-align: center;
      border-radius: 8px;
    }

    .premium-grid { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
    
    .btn {
      display: block;
      background: #ff0000;
      color: white;
      text-decoration: none;
      padding: 10px;
      border-radius: 5px;
      margin-top: 10px;
      font-weight: bold;
    }
    .btn:hover { background: #cc0000; }
  </style>
</head>
<body>

  <header>
    <h1>SOUL SMP</h1>
    <p>The Darkest Survival Experience</p>
  </header>

  <div class="container">
    <h2 class="section-title">Player Ranks</h2>
    <div class="grid">
      <div class="rank-card">Member</div><div class="rank-card">Rookie</div>
      <div class="rank-card">Knight</div><div class="rank-card">Warrior</div>
      <div class="rank-card">Elite</div><div class="rank-card">Hero</div>
      <div class="rank-card">Titan</div><div class="rank-card">Legend</div>
      <div class="rank-card">Mythic</div><div class="rank-card">Immortal</div>
    </div>

    <h2 class="section-title">👑 Premium Ranks</h2>
    <div class="grid premium-grid">
      <div class="rank-card"><h3>VIP</h3><a href="https://discord.gg/BHHU8mDvh7" class="btn">Buy</a></div>
      <div class="rank-card"><h3>MVP</h3><a href="https://discord.gg/BHHU8mDvh7" class="btn">Buy</a></div>
      <div class="rank-card"><h3>MVP+</h3><a href="https://discord.gg/BHHU8mDvh7" class="btn">Buy</a></div>
      <div class="rank-card"><h3>Elite+</h3><a href="https://discord.gg/BHHU8mDvh7" class="btn">Buy</a></div>
      <div class="rank-card"><h3>Legend+</h3><a href="https://discord.gg/BHHU8mDvh7" class="btn">Buy</a></div>
    </div>
  </div>

</body>
</html>
